name: CI/CD - Gerador de Missões (Streamlit + Google ADK)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 🧪 Testes Automatizados do Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar Dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: 🔍 Rodar Testes de Pipeline e Sessões
        run: |
          pytest test_pipeline.py test_session_artifacts.py test_auth.py test_passagem.py test_conversa_etapas.py test_regressao_gates.py test_propagacao.py -v

  deploy:
    name: 🚀 Build & Deploy no Cloud Run (DEV)
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Necessário para Workload Identity Federation (OIDC)
    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🔐 Autenticar no Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER || 'projects/250979926981/locations/global/workloadIdentityPools/plataforma-unooria-dev-gh-pool/providers/github-oidc' }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA || 'plataforma-unooria-dev-deploye@entre-redes-dev.iam.gserviceaccount.com' }}

      - name: ☁️ Configurar Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 🐳 Configurar Docker Auth no Artifact Registry
        run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: 🏗️ Build e Push da Imagem Docker
        env:
          REGISTRY: us-east1-docker.pkg.dev/entre-redes-dev/plataforma-unooria-dev
          IMAGE_NAME: gerador-missoes
        run: |
          IMAGE_TAG="$REGISTRY/$IMAGE_NAME:${{ github.sha }}"
          IMAGE_LATEST="$REGISTRY/$IMAGE_NAME:latest"
          docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"
          echo "IMAGE=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: 🚀 Atualizar Revisão no Cloud Run com Volume Persistente GCS
        run: |
          # --max-instances=1 é obrigatório: o Streamlit guarda os arquivos de download
          # na memória do processo, e um GET em /media que caia em outra instância
          # responde 404 mesmo com os artefatos íntegros no bucket.
          # --min-instances=1 e --no-cpu-throttling: as etapas rodam numa thread em segundo
          # plano (`pipeline/execucao_fundo.py`), que precisa de CPU fora de requisição e de
          # um container que não seja desligado no meio. Espelham o Terraform
          # (`gerador_missoes_min_instances` e `gerador_missoes_cpu_sempre_alocada`); sem
          # eles aqui, cada deploy devolveria o default e divergiria do state.
          # Acesso público, por decisão do dono do projeto (23/09/2026): quem barra é o login
          # da própria aplicação (`tools/auth.py`), com as credenciais e a chave JWT no Secret
          # Manager. Sem os dois segredos, o app recusa subir.
          # A base da plataforma vem de um bucket SÓ DELA, montado `readonly` em /app/base-plataforma
          # (Fundação, `gerador_missoes.tf`). Até 07/10/2026 ela morava em `base-plataforma/` do bucket
          # das sessões, a barra lateral a listava como missão, e o botão de excluir a apagou duas vezes.
          # Os comentários ficam ACIMA do comando: uma linha `#` no meio de uma continuação
          # com `\` encerra o comando ali, e o resto vira comandos soltos que falham.
          gcloud run deploy gerador-missoes \
            --image="$IMAGE" \
            --region=us-east1 \
            --project=entre-redes-dev \
            --allow-unauthenticated \
            --port=8080 \
            --memory=4Gi \
            --cpu=2 \
            --timeout=3600 \
            --session-affinity \
            --min-instances=1 \
            --max-instances=1 \
            --no-cpu-throttling \
            --add-volume=name=artifacts-vol,type=cloud-storage,bucket=entre-redes-dev-adk-artifacts \
            --add-volume-mount=volume=artifacts-vol,mount-path=/app/output \
            --add-volume=name=base-plataforma-vol,type=cloud-storage,bucket=entre-redes-dev-base-plataforma,readonly=true \
            --add-volume-mount=volume=base-plataforma-vol,mount-path=/app/base-plataforma \
            --update-env-vars=STITCH_MCP_MODE=remote,BASE_PLATAFORMA_DIR=/app/base-plataforma \
            --update-secrets=STITCH_API_KEY=plataforma-unooria-dev-stitch-api-key:latest,AUTH_CREDENCIAIS=plataforma-unooria-dev-gerador-credenciais:latest,AUTH_SEGREDO_JWT=plataforma-unooria-dev-gerador-jwt:latest \
            --quiet
